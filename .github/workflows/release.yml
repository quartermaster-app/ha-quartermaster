name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag, manifest and changelog agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/quartermaster/manifest.json)
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$version" != "$manifest" ] || [ "$version" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, manifest.json $manifest and pyproject.toml $project must match"
            exit 1
          fi
          # Notes: the changelog section for this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build quartermaster.zip
        run: cd custom_components/quartermaster && zip -r -X ../../quartermaster.zip . -x '__pycache__/*' '*.pyc'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*|*a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" quartermaster.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
