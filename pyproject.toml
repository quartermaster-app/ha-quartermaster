[project]
name = "ha-quartermaster"
version = "0.2.0"
description = "Home Assistant integration for Quartermaster"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # builtins
    "ASYNC",
    "B",     # bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "D",     # docstrings
    "E",
    "F",
    "FLY",
    "G",     # logging format
    "I",     # isort
    "LOG",
    "PERF",
    "PIE",
    "PL",    # pylint
    "PT",    # pytest style
    "RET",
    "RUF",
    "S",     # bandit
    "SIM",
    "SLF",
    "T20",   # no print
    "UP",
    "W",
]
ignore = [
    "D202",    # blank line after function docstring
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length (the formatter handles it)
    "PLR0911", # too many return statements
    "PLR0913", # too many arguments
    "PLR2004", # magic values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104", "D401", "PLR0917", "S101", "S105", "S106", "SLF001"]
"scripts/**" = ["D103", "PLR0915", "S101", "S105", "S106", "T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.quartermaster", "tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
packages = ["custom_components.quartermaster"]

[[tool.mypy.overrides]]
# Home Assistant re-exports platform classes (TodoItem, BinarySensorDeviceClass)
# from the component package; core imports them the same way.
module = ["homeassistant.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components.quartermaster"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
